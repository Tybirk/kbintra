<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#228be6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KB Intra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Kommunikationsplatform for KB fællesskabet" />
    <meta name="robots" content="noindex, nofollow" />
    <title>KB Intra</title>
    <style>
      /* Inline splash so users see something immediately while JS downloads.
         Removed automatically when React renders into #root. */
      html, body { margin: 0; padding: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #0C0D12; } }
      #initial-splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: inherit;
      }
      #initial-splash::after {
        content: ""; width: 36px; height: 36px;
        border: 3px solid rgba(34, 139, 230, 0.25);
        border-top-color: #228be6; border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" aria-label="Indlæser" role="status"></div>
    </div>
    <script>
      // Capture beforeinstallprompt early — the event fires once and may
      // arrive before React mounts (e.g. while the user is on the login page).
      window.__pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

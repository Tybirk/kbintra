  <body>
    <div id="root"></div>
    <script>
      // Capture beforeinstallprompt early — the event fires once and may
      // arrive before React mounts (e.g. while the user is on the login page).
      window.__pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend paths must never fall through to the SPA. If a request for these
    # reaches the frontend container, the backend router is unregistered in
    # Traefik (e.g. during a deploy) — return 502 so the client sees a real
    # error instead of an HTML 200 that gets parsed as JSON.
    location /api/ {
        return 502;
    }
    location /ws/ {
        return 502;
    }
    location /admin/ {
        return 502;
    }
    location /media/ {
        return 502;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ES modules (.mjs, e.g. the pdf.js worker). nginx's mime.types has no mjs
    # mapping, so without this they're served as application/octet-stream and
    # browsers refuse to start the module worker (PDF preview dies).
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache version.json - used for forced app updates
    location = /version.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Never cache service worker
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

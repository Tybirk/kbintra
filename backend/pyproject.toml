[project]
name = "kbintra-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "channels>=4.3.2",
    "channels-redis>=4.2.1",
    "cryptography>=46.0.3",
    "daphne>=4.2.1",
    "django>=5.2.9",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-api-python-client>=2.188.0",
    "huey>=2.6.0",
    "mammoth>=1.11.0",
    "pillow>=12.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "pywebpush>=2.1.2",
    "sentry-sdk[django]>=2.0.0",
    "whitenoise>=6.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
# Ignore Django/DRF false positives - ty doesn't have Django support yet (planned for 2026)
# See: https://astral.sh/blog/ty
#
# Model.objects, FK _id, QuerySet methods not recognized
unresolved-attribute = "ignore"
# Django field attribute access (.url, .date(), .delete() on FileField, etc.)
possibly-missing-attribute = "ignore"
# Django fields (CharField, TextField, etc.) are str at runtime
invalid-return-type = "ignore"
# Django numeric fields (PositiveIntegerField) support arithmetic
unsupported-operator = "ignore"
# Django TextField supports slicing, JSONField is subscriptable
not-subscriptable = "ignore"
# Django JSONField is iterable at runtime
not-iterable = "ignore"
# Django field types passed where Python types expected (JSONField -> Sized, etc.)
invalid-argument-type = "ignore"
# DRF serializers commonly override methods with different signatures
invalid-method-override = "ignore"

name: Deploy to test2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, kbintra-test2]
    concurrency:
      group: deploy-test2
      cancel-in-progress: false
    steps:
      - name: Run deploy-test.sh
        working-directory: /opt/kbintra-test2
        run: ./deploy-test.sh

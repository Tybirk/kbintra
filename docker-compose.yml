services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - web
    depends_on:
      - traefik
    restart: unless-stopped
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    labels:
      - "traefik.enable=true"
      # API routes
      - "traefik.http.routers.backend-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.routers.backend-api.service=backend"
      # WebSocket routes
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.routers.backend-ws.service=backend"
      # Admin routes
      - "traefik.http.routers.backend-admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.backend-admin.entrypoints=web"
      - "traefik.http.routers.backend-admin.service=backend"
      # Media routes
      - "traefik.http.routers.backend-media.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.backend-media.entrypoints=web"
      - "traefik.http.routers.backend-media.service=backend"
      # Static files (Django admin CSS/JS)
      - "traefik.http.routers.backend-static.rule=PathPrefix(`/static`)"
      - "traefik.http.routers.backend-static.entrypoints=web"
      - "traefik.http.routers.backend-static.service=backend"
      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    volumes:
      - ./data/db.sqlite3:/app/db.sqlite3
      - ./data/media:/app/media
      - ./data/huey.db:/app/huey.db
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  huey:
    build: ./backend
    command: ["uv", "run", "python", "manage.py", "run_huey", "-w", "2", "-k", "thread", "--flush-locks"]
    volumes:
      - ./data/db.sqlite3:/app/db.sqlite3
      - ./data/media:/app/media
      - ./data/huey.db:/app/huey.db
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 256m

  frontend:
    build: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m

networks:
  web:
    driver: bridge

volumes:
  redis_data:

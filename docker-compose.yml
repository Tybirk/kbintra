services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    #ports:
    #  - "127.0.0.1:80:80"  # localhost only — not exposed to public internet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - web
    depends_on:
      - traefik
    restart: unless-stopped
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    labels:
      - "traefik.enable=true"
      # Rate limit middleware (general: 100 req/s, burst 200)
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=200"
      # Strict rate limit for auth endpoints (5 req/s, burst 10)
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=5"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=10"
      # Auth routes (strict rate limit to prevent brute-force)
      - "traefik.http.routers.backend-auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.backend-auth.entrypoints=web"
      - "traefik.http.routers.backend-auth.service=backend"
      - "traefik.http.routers.backend-auth.middlewares=auth-rate-limit"
      # API routes
      - "traefik.http.routers.backend-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.routers.backend-api.service=backend"
      - "traefik.http.routers.backend-api.middlewares=rate-limit"
      # WebSocket routes
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.routers.backend-ws.service=backend"
      # Admin routes
      - "traefik.http.routers.backend-admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.backend-admin.entrypoints=web"
      - "traefik.http.routers.backend-admin.service=backend"
      # Media routes
      - "traefik.http.routers.backend-media.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.backend-media.entrypoints=web"
      - "traefik.http.routers.backend-media.service=backend"
      # Static files (Django admin CSS/JS)
      - "traefik.http.routers.backend-static.rule=PathPrefix(`/static`)"
      - "traefik.http.routers.backend-static.entrypoints=web"
      - "traefik.http.routers.backend-static.service=backend"
      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Traefik health check — only route to healthy containers
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/api/health/"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=5s"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATA_DIR=/app/data
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  huey:
    build: ./backend
    command: ["uv", "run", "python", "manage.py", "run_huey", "-w", "2", "-k", "thread", "--flush-locks"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATA_DIR=/app/data
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "grep -qa run_huey /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Traefik health check — only route to healthy containers
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=5s"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    driver: bridge

volumes:
  redis_data:

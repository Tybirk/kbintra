services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)"
      - "--entrypoints.web.address=:80"
    #ports:
    #  - "127.0.0.1:80:80"  # localhost only — not exposed to public internet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped
    mem_limit: 256m

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - web
    depends_on:
      - traefik
    restart: unless-stopped
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - web
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    image: ghcr.io/tybirk/kbintra-backend:${IMAGE_TAG:-latest}
    labels:
      - "traefik.enable=true"
      # Rate limit middleware (general: 100 req/s, burst 200)
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=200"
      # Strict rate limit for auth endpoints (5 req/s, burst 10)
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=5"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=10"
      # Auth routes (strict rate limit to prevent brute-force)
      - "traefik.http.routers.backend-auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.backend-auth.entrypoints=web"
      - "traefik.http.routers.backend-auth.service=backend"
      - "traefik.http.routers.backend-auth.middlewares=auth-rate-limit"
      # API routes
      - "traefik.http.routers.backend-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.routers.backend-api.service=backend"
      - "traefik.http.routers.backend-api.middlewares=rate-limit"
      # WebSocket routes are served by the separate `backend-ws` (Daphne) service below.
      # Admin routes
      - "traefik.http.routers.backend-admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.backend-admin.entrypoints=web"
      - "traefik.http.routers.backend-admin.service=backend"
      # Media routes
      - "traefik.http.routers.backend-media.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.backend-media.entrypoints=web"
      - "traefik.http.routers.backend-media.service=backend"
      # Static files (Django admin CSS/JS)
      - "traefik.http.routers.backend-static.rule=PathPrefix(`/static`)"
      - "traefik.http.routers.backend-static.entrypoints=web"
      - "traefik.http.routers.backend-static.service=backend"
      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATA_DIR=/app/data
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      # Dump a Python traceback to stderr on segfault — diagnosing intermittent daphne crashes (see docs/daphne-segfault.md)
      - PYTHONFAULTHANDLER=1
      # Disable Autobahn's NVX C-extension fast paths — primary suspect for the segfaults (see docs/daphne-segfault.md)
      - AUTOBAHN_USE_NVX=0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 1524m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # Probe every 2s during start_period instead of waiting a full `interval` (30s)
      # for the first check — flips to healthy as soon as gunicorn answers (~5s).
      # backend-ws and huey depend on `backend: service_healthy`, so this also lets
      # them start ~25s sooner.
      start_interval: 2s

  # WebSocket server (ASGI/Daphne). HTTP is served by `backend` (gunicorn); only
  # /ws is routed here. Shares the same image, code and ./data volume; skips startup
  # tasks (migrations/search) since `backend` owns those and we depend on it.
  backend-ws:
    image: ghcr.io/tybirk/kbintra-backend:${IMAGE_TAG:-latest}
    command: ["uv", "run", "daphne", "--proxy-headers", "--ping-interval", "20", "--ping-timeout", "30", "-v", "1", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.routers.backend-ws.service=backend-ws"
      - "traefik.http.services.backend-ws.loadbalancer.server.port=8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATA_DIR=/app/data
      - SKIP_STARTUP_TASKS=1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      # Dump a Python traceback to stderr on segfault — diagnosing intermittent daphne crashes (see docs/daphne-segfault.md)
      - PYTHONFAULTHANDLER=1
      # Disable Autobahn's NVX C-extension fast paths — primary suspect for the segfaults (see docs/daphne-segfault.md)
      - AUTOBAHN_USE_NVX=0
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Daphne serves the full Django ASGI app, so the HTTP health endpoint works here too.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # Probe every 2s during start_period rather than waiting a full interval (30s)
      # for the first check — marks healthy as soon as Daphne answers.
      start_interval: 2s

  huey:
    image: ghcr.io/tybirk/kbintra-backend:${IMAGE_TAG:-latest}
    command: ["uv", "run", "python", "manage.py", "run_huey", "-w", "2", "-k", "thread", "--flush-locks"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATA_DIR=/app/data
      # `backend` runs migrations/search index on startup; huey depends on it being
      # healthy, so it skips the redundant (and potentially racy) startup tasks.
      - SKIP_STARTUP_TASKS=1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 30s
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "grep -qa run_huey /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # Built by CI. The Sentry DSN / GIPHY key / sourcemap-upload args that used to be
    # passed here are now CI build-args sourced from GitHub Actions secrets (see
    # .github/workflows/ci.yml) — they are baked into the bundle at build time.
    image: ghcr.io/tybirk/kbintra-frontend:${IMAGE_TAG:-latest}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      # Higher than `maintenance` (priority=1) so the real frontend wins
      # whenever its container is up; the maintenance fallback only catches
      # traffic during the brief window when this container is being recreated.
      - "traefik.http.routers.frontend.priority=2"
      - "traefik.http.routers.frontend.middlewares=secheaders"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Security headers middleware (applied to all frontend responses via Traefik,
      # avoiding nginx add_header inheritance issues)
      - "traefik.http.middlewares.secheaders.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.secheaders.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.secheaders.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secheaders.headers.customResponseHeaders.Permissions-Policy=geolocation=(),camera=(),microphone=()"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Catch-all fallback shown only when the frontend (and/or backend) container
  # is unavailable — typically the brief window during a `docker compose up
  # --build` while a container is being recreated. Without this, users would
  # see Traefik's default 404 or an HTML 200 from the SPA being served as a
  # response to /api/*. The page polls /version.json and reloads when the real
  # frontend is back up.
  maintenance:
    image: nginx:alpine
    volumes:
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # PathPrefix(`/`) at priority=1 — lower than the real frontend (2),
      # so this only wins when the frontend router is unregistered.
      - "traefik.http.routers.maintenance.rule=PathPrefix(`/`)"
      - "traefik.http.routers.maintenance.entrypoints=web"
      - "traefik.http.routers.maintenance.priority=1"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # --- Monitoring ---

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_BASE=/dozzle
      - DOZZLE_NO_ANALYTICS=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=PathPrefix(`/dozzle`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.routers.dozzle.middlewares=dozzle-auth"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      # Generate with: htpasswd -nbB admin yourpassword | sed 's/\$/\$\$/g'
      - "traefik.http.middlewares.dozzle-auth.basicauth.users=${DOZZLE_BASICAUTH_USERS}"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 128m

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      # Requires its own subdomain — Uptime Kuma does not support subpath routing.
      # Set UPTIME_KUMA_HOST in .env (e.g. status.yourdomain.com) and add a
      # matching public hostname in the Cloudflare Tunnel dashboard pointing to
      # http://traefik:80.
      - "traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_KUMA_HOST:-status.localhost}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=web"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
    networks:
      - web
    restart: unless-stopped
    mem_limit: 256m

networks:
  web:
    driver: bridge

volumes:
  redis_data:
  uptime_kuma_data:

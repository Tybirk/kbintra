server {
    listen 80;
    root /usr/share/nginx/html;

    # Disable caching so the user's browser re-fetches as soon as the real
    # frontend container is back up.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # /api/* and /ws/* must look like an error to the SPA / axios client so
    # that the in-app maintenance toast fires and queries reject (rather than
    # the SPA receiving HTML and trying to JSON.parse it).
    location /api/ {
        return 503;
    }
    location /ws/ {
        return 503;
    }
    location /admin/ {
        return 503;
    }
    location /media/ {
        return 503;
    }

    # Everything else (i.e. user navigations) gets the friendly Danish page.
    location / {
        try_files /index.html =503;
    }
}
